[project]
name = "dpp-yelp-sentiment"
version = "0.1.0"
description = "Yelp review sentiment classification model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars",
    "plotnine",
    "marimo",
    "scikit-learn",
    "httpx",
    "transformers",
    "torch",
    "accelerate>=1.15.0",
    "ray[tune]>=2.60.0",
]

[project.scripts]
fetch-sentiment-data = "yelp_sentiment.fetch:main"
train-sentiment-model = "yelp_sentiment.train:main"
evaluate-sentiment-models = "yelp_sentiment.evaluate:main"
export-sentiment-model = "yelp_sentiment.export:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yelp_sentiment"
