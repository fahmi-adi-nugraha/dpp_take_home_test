[project]
name = "dpp-delivery-time"
version = "0.1.0"
description = "Zomato delivery-time regression model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars",
    "plotnine",
    "marimo",
    "scikit-learn",
    "httpx",
    "xgboost",
    "joblib",
]

[project.scripts]
fetch-delivery-data = "delivery_time.fetch:main"
train-delivery-model = "delivery_time.train:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "delivery_time"
