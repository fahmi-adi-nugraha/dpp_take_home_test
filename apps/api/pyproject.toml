[project]
name = "dpp-inference-api"
version = "0.1.0"
description = "Local FastAPI inference service for both take-home models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "polars",
    "dpp-delivery-time",
    "dpp-yelp-sentiment",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inference_api"
